name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - apk-development
    paths:
      - "book-concept-app/android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: book-concept-app/android-app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: book-concept-app/android-app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          echo y | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --fund=false

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Assemble ARM64 debug APK
        shell: pwsh
        run: .\android\gradlew.bat -p .\android assembleDebug --no-daemon

      - name: Verify APK
        shell: pwsh
        run: |
          $apk = "android\app\build\outputs\apk\debug\app-debug.apk"
          if (-not (Test-Path $apk)) { throw "APK not found: $apk" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $apk))
          try {
            $abis = $archive.Entries.FullName |
              Where-Object { $_ -match "^lib/[^/]+/" } |
              ForEach-Object { ($_ -split "/")[1] } |
              Sort-Object -Unique
          } finally {
            $archive.Dispose()
          }
          if ($abis.Count -ne 1 -or $abis[0] -ne "arm64-v8a") {
            throw "Expected only arm64-v8a native libraries, found: $($abis -join ', ')"
          }
          Get-FileHash $apk -Algorithm SHA256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MapToLearn-debug-arm64
          path: book-concept-app/android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
