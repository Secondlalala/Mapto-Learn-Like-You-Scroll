name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - apk-development
    paths:
      - "book-concept-app/android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: s/book-concept-app/android-app

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: s

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: s/book-concept-app/android-app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $sdkManager = Get-ChildItem "$env:ANDROID_HOME\cmdline-tools" -Filter sdkmanager.bat -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $sdkManager) { throw "sdkmanager.bat was not found under ANDROID_HOME" }
          1..20 | ForEach-Object { "y" } |
            & $sdkManager.FullName "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --fund=false

      - name: Run unit tests
        run: npm test -- --runInBand --testTimeout=15000

      - name: Assemble standalone ARM64 release APK
        shell: pwsh
        run: .\android\gradlew.bat -p .\android assembleRelease --no-daemon

      - name: Verify APK
        shell: pwsh
        run: |
          $apk = "android\app\build\outputs\apk\release\app-release.apk"
          if (-not (Test-Path $apk)) { throw "APK not found: $apk" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $apk))
          try {
            $abis = @($archive.Entries.FullName |
              Where-Object { $_ -match "^lib/[^/]+/" } |
              ForEach-Object { ($_ -split "/")[1] } |
              Sort-Object -Unique)
          } finally {
            $archive.Dispose()
          }
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $apk))
          try {
            $hasBundle = $null -ne ($archive.Entries | Where-Object { $_.FullName -eq "assets/index.android.bundle" } | Select-Object -First 1)
          } finally {
            $archive.Dispose()
          }
          if ($abis.Count -ne 1 -or $abis[0] -ne "arm64-v8a") {
            throw "Expected only arm64-v8a native libraries, found: $($abis -join ', ')"
          }
          if (-not $hasBundle) { throw "Standalone JavaScript bundle is missing from APK" }
          Get-FileHash $apk -Algorithm SHA256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MapToLearn-release-arm64
          path: s/book-concept-app/android-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
